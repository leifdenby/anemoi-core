[project]
name = "anemoi-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "trimesh>=4.11.1",
]

[tool.uv.workspace]
members = [
    "graphs",
    "models",
    "training",
]

[tool.uv.sources]
anemoi-graphs = { workspace = true }
anemoi-models = { workspace = true }
anemoi-training = { workspace = true }

[dependency-groups]
dev = [
    "anemoi-graphs",
    "anemoi-models",
    "anemoi-training",
    "ipdb>=0.13.13",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

