[project]
name = "anemoi-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10.0",
    "trimesh>=4.11.1",
]

[tool.uv.workspace]
members = [
    "graphs",
    "models",
    "training",
]

[tool.uv.sources]
anemoi-graphs = { workspace = true }
anemoi-models = { workspace = true }
anemoi-training = { workspace = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "anemoi-graphs",
    "anemoi-models",
    "anemoi-training",
    "ipdb>=0.13.13",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
